<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません | Kaname Yamamoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#121214);--ink:light-dark(#1d1d1f,#f2f2f4);--accent:#e2421f}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.8 "Zen Kaku Gothic New",system-ui,sans-serif;text-align:center;padding:24px}
h1{margin:0;font-family:Anybody,sans-serif;font-weight:300;font-stretch:75%;font-size:clamp(120px,30vw,320px);line-height:.9}
p{margin:16px 0 28px;font-size:17px}
a{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;transition:scale .3s cubic-bezier(.2,.8,.2,1)}
a:hover{scale:1.04}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>このページは見つかりませんでした。</p>
  <a href="/">トップに戻る</a>
</main>
</body>
</html>
