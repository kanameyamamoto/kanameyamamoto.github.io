<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaname Yamamoto</title>
<meta name="description" content="山本 要のサイト。作ったツールやサイト、いま関わっている活動、SNSのリンク。">
<meta property="og:title" content="Kaname Yamamoto">
<meta property="og:description" content="山本 要のサイト。作ったツールやサイト、いま関わっている活動、SNSのリンク。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: 白基調で静か。読む部分は普通に読みやすく、触ったところだけ反応する
IDEA: ゴムのように伸び縮みする名前と、カーソルについてくる作品の札
PICTURE: 画面いっぱいの名前そのもの。作品は線で描いた小さな図
COLOUR and TYPE: 白・墨・朱の3色。名前はAnybody（幅と太さが動く）、本文はZen Kaku Gothic New
LAYOUT: 左揃えの1カラム。名前 → 一言 → Works → Now → Links
*/
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#121214);
  --ink:light-dark(#1d1d1f,#f2f2f4);
  --sub:light-dark(#5f5f66,#a7a7ae);
  --tile:light-dark(#f2f2f4,#1f1f23);
  --line:light-dark(#d9d9de,#34343a);
  --accent:#e2421f;
  --gap:clamp(72px,11vw,160px);
  --side:max(5vw,20px);
  --ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{word-break:auto-phrase;text-wrap:pretty;margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--side)}

/* header */
.top{display:flex;justify-content:flex-end;align-items:center;padding-top:clamp(32px,4vw,48px);font-size:17px}
.top nav{display:flex;align-items:center;gap:34px}
.snd{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:-8px -8px -8px -4px;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;transition:scale .3s var(--ease)}
.snd:hover{scale:1.1}
.snd .eq{position:relative;display:flex;align-items:flex-end;gap:2.5px;height:14px;scale:1.15}
.snd .eq i{width:1.5px;border-radius:1px;background:currentColor}
.snd .eq i:nth-child(1){height:8px}
.snd .eq i:nth-child(2){height:14px}
.snd .eq i:nth-child(3){height:5px}
.snd .eq i:nth-child(4){height:11px}
.snd .eq::after{content:"";position:absolute;left:50%;top:50%;width:21px;height:1.5px;margin:-.75px 0 0 -10.5px;border-radius:1px;background:currentColor;box-shadow:0 0 0 1.2px var(--bg);rotate:45deg;transition:scale .3s var(--ease)}
.snd[aria-pressed=true] .eq::after{scale:0 1}
.snd[aria-pressed=true] .eq i{animation:eq 1s ease-in-out infinite alternate}
.snd[aria-pressed=true] .eq i:nth-child(1){animation-duration:.9s}
.snd[aria-pressed=true] .eq i:nth-child(2){animation-duration:.7s;animation-delay:-.3s}
.snd[aria-pressed=true] .eq i:nth-child(3){animation-duration:1.1s;animation-delay:-.6s}
.snd[aria-pressed=true] .eq i:nth-child(4){animation-duration:.8s;animation-delay:-.2s}
@keyframes eq{0%{height:3px}100%{height:14px}}
.top a{text-decoration:none}
.link{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .35s var(--ease)}
.link:hover{background-size:100% 1px}

/* hero name */
.first{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:min(24px,3vh) 0 min(72px,8vh)}
.name{margin:0;font-family:Anybody,sans-serif;font-weight:300;font-stretch:75%;font-size:clamp(56px,min(15vw,30vh),200px);line-height:.86;letter-spacing:-.01em;cursor:default;user-select:none;touch-action:pan-y}
.name span{display:block;white-space:nowrap}
.name i{font-style:normal;display:inline-block;font-variation-settings:"wdth" 75,"wght" 300}
.intro{margin:clamp(32px,4vw,48px) 0 0;max-width:34em;font-size:clamp(16px,1.5vw,18px)}
.intro span{white-space:nowrap}

/* sections */
section{padding-top:var(--gap)}
h2{margin:0 0 clamp(20px,3vw,36px);font-family:Anybody,sans-serif;font-weight:700;font-stretch:80%;font-size:clamp(32px,4vw,48px);line-height:1.05}

/* works */
.works{list-style:none;margin:0;padding:0}
.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:24px;width:100%;padding:clamp(12px,1.6vw,20px) 0;border:0;background:none;text-align:left;cursor:pointer;transition:opacity .3s var(--ease)}
.row .t{font-weight:700;font-size:clamp(24px,3.6vw,48px);line-height:1.3;transition:transform .4s var(--ease)}
.row .k{font-size:15px;color:var(--sub);white-space:nowrap}
.row .th{display:none}
.row .tx{display:contents}
.works:hover .row{opacity:.28}
.works:hover .row:hover{opacity:1}
.row:hover .t{transform:translateX(12px)}

/* floating preview */
.peek{position:fixed;left:0;top:0;width:340px;aspect-ratio:16/10;border-radius:14px;background:var(--tile);overflow:hidden;box-shadow:0 0 0 1px var(--line);pointer-events:none;z-index:20;opacity:0;scale:.85;transition:opacity .25s var(--ease),scale .35s var(--ease);will-change:transform}
.peek.on{opacity:1;scale:1}
.peek.lift{box-shadow:0 0 0 1px var(--line),0 16px 40px rgb(0 0 0/.14)}
.art{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}

/* now */
.now{margin:0;padding:0;list-style:none;max-width:860px}
.now li{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:24px;padding:12px 0;font-size:17px}
.now b{font-weight:700}

/* links */
.sns{display:flex;flex-wrap:wrap;gap:12px 40px;margin:0;padding:0;list-style:none}
.sns a{display:inline-flex;justify-content:center;white-space:nowrap;line-height:1.25;font-family:Anybody,sans-serif;font-weight:600;font-stretch:70%;font-size:clamp(28px,3.4vw,44px);text-decoration:none;transition:font-stretch .4s var(--ease),font-weight .4s var(--ease)}
.sns a:hover{font-stretch:78%;font-weight:800}
.mail{margin:20px 0 0;font-size:17px}

footer{padding:var(--gap) 0 32px;font-size:13px;color:var(--sub)}

/* detail */
.detail{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;visibility:hidden}
.detail.open{visibility:visible}
.detail .wrap{max-width:880px;padding-top:24px;padding-bottom:80px}
.close{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:auto;border:1px solid var(--line);border-radius:50%;background:var(--bg);cursor:pointer;transition:scale .3s var(--ease)}
.close:hover{scale:1.08}
.close svg{width:16px;height:16px}
.d-art{margin-top:16px;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--tile);box-shadow:0 0 0 1px var(--line);transform-origin:0 0}
.d-body{opacity:0;transform:translateY(12px);transition:opacity .4s var(--ease) .15s,transform .5s var(--ease) .15s}
.detail.shown .d-body{opacity:1;transform:none}
.d-k{margin:32px 0 0;font-size:15px;color:var(--sub)}
.d-t{margin:4px 0 0;font-size:clamp(28px,4vw,44px);line-height:1.3}
.d-p{margin:20px 0 0;max-width:36em;font-size:17px}
.d-go{display:inline-block;margin-top:28px;padding:12px 22px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;transition:scale .3s var(--ease)}
.d-go:hover{scale:1.04}
.d-go[hidden]{display:none}
body.lock{overflow:hidden}
body.grab,body.grab *{cursor:grabbing!important}
.th.fly{position:relative;z-index:5;box-shadow:0 12px 30px rgb(0 0 0/.12)}

/* touch / narrow */
@media (hover:none),(max-width:720px){
  .row{grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
  .row .th{touch-action:none;display:block;width:96px;aspect-ratio:16/10;border-radius:10px;background:var(--tile);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
  .row .tx{display:flex;flex-direction:column;gap:2px}
  .row .k{white-space:normal}
  .works:hover .row{opacity:1}
  .row:hover .t{transform:none}
}
@media (max-width:720px){
  .name{font-size:min(calc((100vw - 2*max(5vw,20px))/1.8),34vh);font-stretch:55%}
  .name i{font-variation-settings:"wdth" 55,"wght" 300}
  .top{font-size:16px}
  .top nav{gap:22px}
  .row .t{font-size:20px}
  .sns{gap:10px 28px}
  .now li{grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
  .snd .eq i{animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="first">
  <header class="top">
    <nav><a href="#works" class="link">Works</a><a href="#now" class="link">Now</a><a href="#links" class="link">Links</a><button class="snd" id="snd" aria-pressed="false" aria-label="クリック音"><span class="eq"><i></i><i></i><i></i><i></i></span></button></nav>
  </header>

  <div class="wrap">
    <button class="close" id="close" aria-label="閉じる"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l12 12M14 2L2 14"/></svg></button>

      <a class="d-go" id="d-go" target="_blank" rel="noopener" hidden>サイトを開く</a>

<script>
{
const S='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const A='var(--accent)';
const svg=b=>`<svg class="art" viewBox="0 0 400 250" ${S}>${b}</svg>`;
const IMG={gsh:'img/game-sector-hub.webp',seiji:'img/seiji-no-mado.webp',tectori:'img/tectori.webp',pear:'img/pear-browser.webp'};
const ART=Object.fromEntries(Object.entries(IMG).map(([k,v])=>[k,`<img class="art" src="${v}" alt="" decoding="async">`]));
for(const v of Object.values(IMG)){const i=new Image();i.src=v;}
const WORKS=[
  {id:'gsh',t:'Game Sector DB',k:'Webサイト',url:'https://gamesectordb.com/',p:'世界12か国・地域のアプリ売上ランキングから推定売上を出し、ゲーム会社の決算や株価とつなげて見られる、個人投資家向けのサイト。'},
  {id:'seiji',t:'せいじのまど',k:'Webサイト',url:'https://seijinomado.com/',p:'政治の情報を、特定の政党やメディアに偏らずに届けるサイト。国会で決まったことや政党、国会議員、知事などを、事実と意見を分けて載せています。データは登録なしで使える公開APIでも配っています。'},
  {id:'tectori',t:'株式会社TectorI HP',k:'Webサイト',url:'https://www.tectori.biz/',p:'墨田区のeスポーツの会社、株式会社TectorIの公式サイト。'},
  {id:'pear',t:'Pear Browser',k:'スマホアプリ',url:'https://play.google.com/store/apps/details?id=pear.browser',go:'Google Playで見る',p:'よく開くWebページをタブとして保存して、すぐに開けるようにするスマホ向けのブラウザアプリ。ゲームの攻略サイトのように、同じページを何度も開く人のためのものです。Flutterで開発中。'}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=document.getElementById('list');
const fine=matchMedia('(hover:hover) and (pointer:fine) and (min-width:721px)');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---- name: letters stretch toward the pointer ---- */
const nameEl=document.getElementById('name');
for(const sp of nameEl.querySelectorAll('span')){sp.innerHTML=[...sp.textContent].map(c=>`<i aria-hidden="true">${c}</i>`).join('');}
let RW=innerWidth<721?55:75;const RG=300;
const letters=[...nameEl.querySelectorAll('i')].map(el=>({el,x:0,y:0,w:RW,g:RG,tw:RW,tg:RG}));
const measure=()=>{RW=document.documentElement.clientWidth<721?55:75;for(const l of letters){l.el.style.fontVariationSettings=`"wdth" ${RW},"wght" ${RG}`;}
  for(const l of letters){const r=l.el.getBoundingClientRect();l.x=r.left+r.width/2+scrollX;l.y=r.top+r.height/2+scrollY;}
  for(const l of letters){l.el.style.fontVariationSettings=`"wdth" ${l.w},"wght" ${l.g}`;}};
let px=-9999,py=-9999,lastStretch=0;
const aim=()=>{const R=Math.max(160,innerWidth*.22),MW=innerWidth<721?115:150;
  for(const l of letters){const d=Math.hypot(px-(l.x-scrollX),py-(l.y-scrollY));const t=Math.max(0,1-d/R);const e=t*t*(3-2*t);l.tw=RW+e*(MW-RW);l.tg=RG+e*(900-RG);}};
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;aim();},{passive:true});
document.documentElement.addEventListener('mouseleave',()=>{px=py=-9999;aim();});
addEventListener('resize',()=>{measure();aim();});
document.fonts.ready.then(()=>{measure();letters.forEach(l=>{l.w=l.tw=RW;});
  if(!reduce){letters.forEach(l=>{l.w=50;l.g=900;});
    // one entrance: heavy, tight letters loosen into place, left to right
    letters.forEach((l,i)=>{l.delay=performance.now()+i*45;});}
  tick();});

/* ---- works: preview follows the cursor, and can be grabbed and thrown ---- */
const peek=document.getElementById('peek');
let mx=0,my=0,cx=0,cy=0,vx=0,cur=null;
let mode='follow',ax=0,ay=0,avx=0,avy=0,arot=0,spin=0,gx=0,gy=0,downX=0,downY=0,dragged=false,pressed=false;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;
  if(pressed&&mode!=='held'&&Math.hypot(mx-downX,my-downY)>6){mode='held';dragged=true;gx=peek.offsetWidth*.35;gy=peek.offsetHeight/2;document.body.classList.add('grab');peek.classList.add('on');}
},{passive:true});
list.addEventListener('pointerover',e=>{if(!fine.matches||mode==='vanish')return;const r=e.target.closest('.row');if(!r||r===cur)return;
  if(!cur&&mode==='follow'){cx=mx;cy=my;}cur=r;if(mode==='follow')peek.innerHTML=ART[r.dataset.id];peek.classList.add('on');});
list.addEventListener('pointerleave',()=>{cur=null;});
addEventListener('pointerdown',()=>{dragged=false;},true);
fine.addEventListener('change',()=>{mode='follow';pressed=false;cur=null;peek.classList.remove('on','lift');});
list.addEventListener('pointerdown',e=>{if(!fine.matches||e.button!==0||!e.target.closest('.row'))return;pressed=true;dragged=false;downX=e.clientX;downY=e.clientY;});
addEventListener('pointerup',()=>{pressed=false;document.body.classList.remove('grab');
  if(mode==='held'){mode='fling';spin=avx*.6;sfx.whoosh(Math.hypot(avx,avy));if(reduce)vanish();}});
// after a throw the card simply fades where it stops
function vanish(){mode='vanish';peek.classList.remove('on','lift');setTimeout(()=>{mode='follow';cur=null;},320);}
list.addEventListener('click',e=>{if(dragged){e.stopImmediatePropagation();e.preventDefault();dragged=false;}},true);

function movePeek(){
  // where the preview rests: beside the title, following the cursor
  const nx=cx+(mx-cx)*.16,ny=cy+(my-cy)*.16;vx+=((nx-cx)-vx)*.2;cx=nx;cy=ny;
  let hx=cx+32;if(cur){const t=cur.querySelector('.t').getBoundingClientRect();hx=Math.max(hx,t.right+40);}
  const lr=list.getBoundingClientRect().right,W=peek.offsetWidth,H=peek.offsetHeight;hx=Math.min(hx,lr-W-110);
  const hy=cy-H/2,hrot=reduce?0:Math.max(-8,Math.min(8,vx*.5));
  if(mode==='follow'){ax=hx;ay=hy;arot=hrot;avx=avy=0;}
  else if(mode==='held'){const tx=mx-gx,ty=my-gy;const ox=ax,oy=ay;ax+=(tx-ax)*.5;ay+=(ty-ay)*.5;avx=ax-ox;avy=ay-oy;arot+=(Math.max(-20,Math.min(20,avx*1.2))-arot)*.3;}
  else if(mode==='fling'){ax+=avx;ay+=avy;avx*=.95;avy*=.95;arot+=spin;spin*=.95;
    if(ax<0){ax=0;sfx.knock(Math.abs(avx));avx=Math.abs(avx)*.7;spin*=-1;} if(ax>innerWidth-W){ax=innerWidth-W;sfx.knock(Math.abs(avx));avx=-Math.abs(avx)*.7;spin*=-1;}
    if(ay<0){ay=0;sfx.knock(Math.abs(avy));avy=Math.abs(avy)*.7;} if(ay>innerHeight-H){ay=innerHeight-H;sfx.knock(Math.abs(avy));avy=-Math.abs(avy)*.7;}
    if(Math.hypot(avx,avy)<.8)vanish();}
  if(mode==='follow'&&!cur)peek.classList.remove('on');
  peek.classList.toggle('lift',mode==='held'||mode==='fling');
  peek.style.transform=`translate(${ax}px,${ay}px) rotate(${arot}deg)`;
}

function tick(){
  const now=performance.now();
  for(const l of letters){
    if(l.delay&&now<l.delay){l.el.style.fontVariationSettings=`"wdth" ${l.w},"wght" ${l.g}`;continue;}l.delay=0;
    const k=reduce?1:.14;l.w+=(l.tw-l.w)*k;l.g+=(l.tg-l.g)*k;
    l.el.style.fontVariationSettings=`"wdth" ${l.w.toFixed(1)},"wght" ${l.g.toFixed(0)}`;}
  {let sum=0;for(const l of letters)sum+=(l.w-RW)/(150-RW);sum/=letters.length;sfx.stretch(Math.min(1,sum*3),Math.abs(sum-lastStretch)*6);lastStretch=sum;}
  if(fine.matches)movePeek();
  for(const f of flying)f.step();
  requestAnimationFrame(tick);
}

/* ---- touch / narrow screens: drag a thumbnail and let go ---- */
const flying=new Set();
list.addEventListener('pointerdown',e=>{
  if(fine.matches)return;const th=e.target.closest('.th');if(!th||th._f)return;
  const f={th,x:0,y:0,vx:0,vy:0,r:0,held:true,moved:false,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,base:th.getBoundingClientRect(),
    step(){
      if(!this.held){this.x+=this.vx;this.y+=this.vy;this.vx*=.93;this.vy*=.93;
        const b=this.base;if(b.left+this.x<0||b.right+this.x>innerWidth){sfx.knock(Math.abs(this.vx));this.vx*=-.7;this.x=Math.max(-b.left,Math.min(innerWidth-b.right,this.x));}
        this.r+=this.vx*.4;
        if(Math.hypot(this.vx,this.vy)<.6){
          // stopped: fade out where it lies, then come back in its own slot
          flying.delete(this);th.style.transition='opacity .3s ease';th.style.opacity='0';
          setTimeout(()=>{th.style.transform='';th.classList.remove('fly');th.style.opacity='1';
            setTimeout(()=>{th.style.transition='';th._f=null;},320);},320);return;}}
      th.style.transform=`translate(${this.x}px,${this.y}px) rotate(${this.r}deg)`;}};
  th._f=f;th.setPointerCapture(e.pointerId);
  const mv=ev=>{const dx=ev.clientX-f.sx,dy=ev.clientY-f.sy;if(!f.moved&&Math.hypot(dx,dy)>6){f.moved=true;th.classList.add('fly');flying.add(f);}
    if(f.moved){f.vx=ev.clientX-f.lx;f.vy=ev.clientY-f.ly;f.x=dx;f.y=dy;f.r=Math.max(-15,Math.min(15,f.vx*1.5));}f.lx=ev.clientX;f.ly=ev.clientY;};
  const up=()=>{th.removeEventListener('pointermove',mv);th.removeEventListener('pointerup',up);th.removeEventListener('pointercancel',up);
    f.held=false;if(f.moved){dragged=true;sfx.whoosh(Math.hypot(f.vx,f.vy));if(reduce){f.vx=f.vy=0;}}else th._f=null;};
  th.addEventListener('pointermove',mv);th.addEventListener('pointerup',up);th.addEventListener('pointercancel',up);
});

/* ---- sound (off until switched on): soft taps, air when the name stretches ---- */
const snd=document.getElementById('snd');let soundOn=false,ac=null,noise=null,air=null;
try{soundOn=localStorage.getItem('sound')==='on';}catch(_){}
const setSnd=v=>{soundOn=v;snd.setAttribute('aria-pressed',v);try{localStorage.setItem('sound',v?'on':'off');}catch(_){}if(!v&&air)air.g.gain.setTargetAtTime(0,ac.currentTime,.05);};
setSnd(soundOn);
const audio=()=>{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
    noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(ac.state==='suspended')ac.resume();return ac;};
const burst=(f,q,peak,dec,type='bandpass')=>{const t=ac.currentTime,n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  n.buffer=noise;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  n.connect(fl).connect(g).connect(ac.destination);n.start(t,Math.random()*.5);n.stop(t+dec+.02);return {fl,t};};
const body=(f,peak,dec)=>{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+dec);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dec+.02);};
const sfx={
  // a quiet, papery tap
  tap(){if(!soundOn)return;try{audio();burst(3400,.9,.22,.035);body(190,.05,.05);}catch(_){}},
  // air that follows a throw
  whoosh(sp){if(!soundOn)return;try{audio();const v=Math.min(1,sp/40);const {fl,t}=burst(500,.8,.05+.12*v,.32);fl.frequency.setValueAtTime(500,t);fl.frequency.exponentialRampToValueAtTime(1800,t+.28);}catch(_){}},
  // soft knock against the edge
  knock(sp){if(!soundOn)return;try{audio();const v=Math.min(1,sp/30);burst(900,.7,.04+.1*v,.06,'lowpass');body(110,.06+.08*v,.09);}catch(_){}},
  // continuous breath while the name stretches: louder when it moves, brighter when it is wide
  stretch(amount,change){if(!soundOn||!ac)return;try{
    if(!air){const n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();n.buffer=noise;n.loop=true;fl.type='bandpass';fl.Q.value=.7;g.gain.value=0;n.connect(fl).connect(g).connect(ac.destination);n.start();air={fl,g};}
    const t=ac.currentTime;air.fl.frequency.setTargetAtTime(350+amount*1600,t,.08);air.g.gain.setTargetAtTime(Math.min(.09,change*.9),t,.06);}catch(_){}}
};
snd.addEventListener('click',()=>{setSnd(!soundOn);if(soundOn){audio();sfx.tap();}});
addEventListener('pointerdown',e=>{if(e.target.closest('a,button')&&!e.target.closest('#snd'))sfx.tap();});

/* ---- links: stretch in place, never push the others ---- */
const snsLinks=[...document.querySelectorAll('.sns a')];
const lockLinks=()=>{for(const l of snsLinks)l.style.width='';for(const l of snsLinks)l.style.width=l.getBoundingClientRect().width+'px';};
document.fonts.ready.then(lockLinks);addEventListener('resize',lockLinks);

/* ---- detail: the preview grows into the page ---- */
const det=document.getElementById('detail'),dArt=document.getElementById('d-art');
let lastRow=null;
function open(id,from,push){
  const w=WORKS.find(x=>x.id===id);if(!w)return;
  document.getElementById('d-k').textContent=w.k;
  document.getElementById('d-t').textContent=w.t;
  document.getElementById('d-p').textContent=w.p;
  const go=document.getElementById('d-go');if(w.url){go.href=w.url;go.textContent=w.go||'サイトを開く';go.hidden=false;}else go.hidden=true;
  dArt.innerHTML=ART[id];
  det.scrollTop=0;det.classList.add('open');document.body.classList.add('lock');
  if(from&&!reduce){const a=from.getBoundingClientRect(),b=dArt.getBoundingClientRect();
    dArt.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width},${a.height/b.height})`,borderRadius:'40px'},{transform:'none',borderRadius:'18px'}],{duration:560,easing:'cubic-bezier(.2,.8,.2,1)'});}
  requestAnimationFrame(()=>det.classList.add('shown'));
  peek.classList.remove('on');cur=null;
  if(push)history.pushState({w:id},'','#'+id);
  document.getElementById('close').focus({preventScroll:true});
}
function shut(pop){
  if(!det.classList.contains('open'))return;
  det.classList.remove('shown');
  const fin=()=>{det.classList.remove('open');document.body.classList.remove('lock');if(lastRow)lastRow.focus({preventScroll:true});};
  if(reduce)fin();else det.animate([{opacity:1},{opacity:0}],{duration:220,easing:'ease-out'}).onfinish=fin;
  if(!pop&&location.hash)history.pushState(null,'',location.pathname+location.search);
}
list.addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;lastRow=r;
  const from=fine.matches&&peek.classList.contains('on')?peek:r.querySelector('.th');open(r.dataset.id,from,true);});
document.getElementById('close').addEventListener('click',()=>shut(false));
addEventListener('keydown',e=>{if(e.key==='Escape')shut(false);});
addEventListener('popstate',()=>{const id=location.hash.slice(1);if(WORKS.some(w=>w.id===id))open(id,null,false);else shut(true);});
const h=location.hash.slice(1);if(WORKS.some(w=>w.id===h))open(h,null,false);
}
</script>
